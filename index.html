<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nov. | Note</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>">
  <style>
  /* ==================== CSS 变量 — 深空科幻主题 ==================== */
  :root, [data-theme="dark"] {
    --bg-primary: #16162a;
    --bg-secondary: #1e1e36;
    --bg-tertiary: #262642;
    --bg-hover: #32324e;
    --border-color: #36365a;
    --text-primary: #eaeaf5;
    --text-secondary: #a8a8c4;
    --text-muted: #7a7a98;
    --accent: #818cf8;
    --accent-hover: #a5b4fc;
    --accent-bg: rgba(129,140,248,0.1);
    --code-bg: #12122a;
    --code-border: #36365a;
    --scrollbar-thumb: #36365a;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
    --glass-bg: rgba(30,30,54,0.7);
    --glass-border: rgba(129,140,248,0.12);
    --glass-shadow: 0 8px 32px rgba(0,0,0,0.35);
    --glow-accent: 0 0 20px rgba(129,140,248,0.15);
    --kw: #c4b5fd; --cmt: #7a7a98; --str: #7dd3fc;
    --num: #22d3ee; --preproc: #a78bfa; --reg: #ffa657; --var: #7ee787;
  }
  [data-theme="light"] {
    --bg-primary: #fafaff;
    --bg-secondary: #f0f0f8;
    --bg-tertiary: #e8e8f2;
    --bg-hover: #d8d8e8;
    --border-color: #d0d0e0;
    --text-primary: #1a1a2e;
    --text-secondary: #5a5a78;
    --text-muted: #8a8aa0;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --accent-bg: rgba(99,102,241,0.08);
    --code-bg: #f2f2f8;
    --code-border: #d8d8e8;
    --scrollbar-thumb: #c8c8d8;
    --shadow: 0 2px 8px rgba(0,0,0,0.06);
    --glass-bg: rgba(250,250,255,0.85);
    --glass-border: rgba(99,102,241,0.1);
    --glass-shadow: 0 4px 16px rgba(0,0,0,0.04);
    --glow-accent: 0 0 12px rgba(99,102,241,0.12);
    --kw: #d14; --cmt: #5a5a78; --str: #0a3069;
    --num: #0550ae; --preproc: #8250df; --reg: #953800; --var: #116329;
  }

  /* ==================== 重置 ==================== */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{font-size:16px;scroll-behavior:smooth;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;background:var(--bg-primary);color:var(--text-primary);line-height:1.6;overflow:hidden;cursor:auto}
  body.disable-cursor, body.disable-cursor *{cursor:auto!important}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:var(--scrollbar-track,transparent)}
  ::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}

  /* ==================== 布局 ==================== */
  #app{display:flex;flex-direction:column;height:100vh}
  .app-header{display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 16px;background:var(--glass-bg);border-bottom:1px solid var(--glass-border);flex-shrink:0;z-index:100;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 1px 0 rgba(124,111,240,0.08)}
  .app-body{display:flex;flex:1;overflow:hidden}

  /* ==================== 顶部导航 ==================== */
  .header-left{display:flex;align-items:center;gap:12px}
  .sidebar-toggle{display:none;background:none;border:none;color:var(--text-secondary);cursor:pointer;padding:4px}
  .logo{font-size:19px;font-weight:700;color:var(--text-primary);white-space:nowrap;cursor:pointer;transition:opacity .15s}
  .logo:hover{opacity:.7}
  .logo-icon{color:var(--accent);margin-right:6px;font-weight:700}
  .header-center{flex:1;max-width:480px;margin:0 16px}
  .search-wrapper{position:relative}
  .search-input{width:100%;height:34px;padding:0 12px 0 32px;background:var(--bg-tertiary);border:1px solid var(--border-color);border-radius:6px;color:var(--text-primary);font-size:14px;outline:none;transition:border-color .15s}
  .search-input::placeholder{color:var(--text-muted)}
  .search-input:focus{border-color:var(--accent)}
  .search-icon{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--text-muted)}
  .search-results-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:8px;box-shadow:var(--glass-shadow);max-height:400px;overflow-y:auto;display:none;z-index:200;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  .search-results-dropdown.active{display:block}
  .search-result-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border-color);transition:background .1s}
  .search-result-item:last-child{border-bottom:none}
  .search-result-item:hover{background:var(--bg-hover)}
  .search-result-title{font-size:13px;font-weight:600;color:var(--accent)}
  .search-result-excerpt{font-size:12px;color:var(--text-secondary);margin-top:4px}
.search-highlight{background:#fbbf24;color:#1e1e2e;border-radius:2px;padding:0 2px;scroll-margin-top:80px}
  .header-right{display:flex;align-items:center;gap:8px}
  .header-btn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;background:none;border:none;border-radius:6px;color:var(--text-secondary);cursor:pointer;transition:background .15s,color .15s}
  .header-btn:hover{background:var(--bg-hover);color:var(--text-primary)}
  .mode-badge{display:none;align-items:center;gap:4px;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-bg);letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;cursor:default;animation:badgePulse 2s ease-in-out infinite}
  @keyframes badgePulse{0%,100%{opacity:1}50%{opacity:.7}}

  /* ==================== 侧边栏 ==================== */
  .sidebar{width:var(--sidebar-width,260px);background:var(--glass-bg);border-right:1px solid var(--glass-border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;position:relative;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .sidebar-resize-handle{position:absolute;right:-3px;top:0;bottom:0;width:6px;cursor:col-resize;z-index:50;background:transparent}
  .sidebar-resize-handle::after{content:'';position:absolute;right:2px;top:50%;transform:translateY(-50%);width:2px;height:30px;border-radius:1px;background:var(--border-color);opacity:0;transition:opacity .15s,background .15s}
  .sidebar-resize-handle:hover::after,.sidebar-resize-handle.active::after{opacity:1;background:var(--accent)}
  .sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--border-color)}
  .sidebar-title{font-size:17px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px}
  .sidebar-actions{display:flex;gap:4px}
  .sidebar-add-btn{display:flex;align-items:center;justify-content:center;width:24px;height:24px;background:none;border:none;border-radius:4px;color:var(--text-muted);cursor:pointer;font-size:16px;transition:background .1s,color .1s}
  .sidebar-add-btn:hover{background:var(--bg-hover);color:var(--accent)}
  .sidebar-content{flex:1;overflow-y:auto;padding:8px 0}
  .category-item{margin-bottom:2px}
  .category-header{display:flex;align-items:center;padding:6px 12px;cursor:pointer;user-select:none;transition:background .1s;border-radius:4px;margin:0 6px}
  .category-header:hover{background:var(--bg-hover)}
  .category-header.active{background:var(--accent-bg);color:var(--accent)}
  .category-icon{margin-right:8px;font-size:11px;transition:transform .15s;color:var(--text-muted);min-width:12px}
  .category-icon.expanded{transform:rotate(90deg)}
  .category-name{flex:1;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .category-count{font-size:11px;color:var(--text-muted);margin-left:4px}
  .category-item{border-left:1px solid transparent;margin-left:0}
  .category-item .category-item{border-left:1px solid var(--border-color);margin-left:10px}
  .category-actions{display:none;gap:2px;margin-left:4px}
  .category-header:hover .category-actions{display:flex}
  .cat-action-btn{width:20px;height:20px;background:none;border:none;border-radius:3px;color:var(--text-muted);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
  .cat-action-btn:hover{background:var(--bg-tertiary);color:var(--text-primary)}
  .note-delete-btn{font-size:10px;color:var(--text-muted);cursor:pointer;opacity:.4;transition:opacity .1s;user-select:none;margin-left:4px}
  .note-item:hover .note-delete-btn{opacity:.7}
  .note-delete-btn:hover{opacity:1;color:var(--accent)}
  .category-notes{display:none;padding-left:20px}
  .category-notes.open{display:block;max-height:180px;overflow-y:auto;scrollbar-width:thin}
  .category-notes.open::-webkit-scrollbar{width:4px}
  .category-notes.open::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:2px}
  .note-item{padding:4px 12px;font-size:14px;color:var(--text-secondary);cursor:pointer;border-radius:3px;margin:1px 6px;transition:background .1s,color .1s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:2px;user-select:none}
  .note-item:hover{background:var(--bg-hover);color:var(--text-primary)}
  .note-item.active{background:var(--accent-bg);color:var(--accent)}
  .note-item-add{color:var(--accent);opacity:.6;cursor:pointer}
  .note-date{font-size:10px;color:var(--text-muted);margin-left:6px}
  /* 拖拽样式 */
  .drag-handle{display:inline-block;margin-right:4px;color:var(--text-muted);cursor:grab;font-size:11px;user-select:none;opacity:.5;transition:opacity .15s;flex-shrink:0}
  .drag-handle:hover{opacity:1;color:var(--accent)}
  .drag-handle:active{cursor:grabbing}
  .category-item.dragging,.note-item.dragging{opacity:.4}
  .category-item.drag-over{border-top:2px solid var(--accent)}
  .note-item.drag-over{border-top:2px solid var(--accent)}
  .note-item-title{flex:1;overflow:hidden;text-overflow:ellipsis;font-size:14px;color:var(--text-secondary)}

  /* ==================== 主内容区 ==================== */
  .main-content{flex:1;overflow-y:auto;background:var(--bg-primary)}
  .home-view{max-width:800px;margin:0 auto;padding:40px 24px}
  .home-title{font-size:30px;font-weight:700;margin-bottom:8px;color:var(--text-primary)}
  .home-subtitle{font-size:19px;color:var(--text-secondary);margin-bottom:8px;line-height:1.7}
  .home-subtitle-attribution{font-size:17px;color:var(--text-muted);text-align:right;margin-bottom:32px;font-style:italic}
  .home-section{margin-bottom:32px}
  .home-section-title{font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border-color)}
  .category-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .category-card{padding:16px;background:var(--glass-bg);border:1.5px solid rgba(124,111,240,0.3);border-radius:10px;cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .category-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--glow-accent)}
  .category-card-title{font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:4px}
  .category-card-count{font-size:12px;color:var(--text-muted)}
  .recent-notes-list{list-style:none}
  .recent-note-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-color);cursor:pointer;transition:color .1s}
  .recent-note-item:hover{color:var(--accent)}
  .recent-note-title{font-size:13px;font-weight:500}
  .recent-note-date{font-size:12px;color:var(--text-muted);white-space:nowrap;margin-left:12px}

  /* ==================== 笔记视图 ==================== */
  .note-view{max-width:800px;margin:0 auto;padding:32px 24px}
  .note-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--glass-border);flex-wrap:wrap;gap:8px}
  .note-title{font-size:24px;font-weight:700}
  .note-actions{display:flex;gap:6px}
  .note-action-btn{display:flex;align-items:center;gap:4px;padding:4px 10px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:6px;color:var(--text-secondary);font-size:12px;cursor:pointer;transition:background .15s,color .15s;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .note-action-btn:hover{background:var(--bg-hover);color:var(--text-primary)}
  .note-action-btn.danger:hover{background:rgba(239,68,68,0.1);color:#ef4444}
  .note-meta{font-size:12px;color:var(--text-muted);margin-bottom:24px}

  /* ==================== Markdown 渲染 ==================== */
  .md-content h1{font-size:24px;margin:32px 0 16px;font-weight:700;border-bottom:1px solid var(--border-color);padding-bottom:8px}
  .md-content h2{font-size:20px;margin:28px 0 12px;font-weight:600}
  .md-content h3{font-size:17px;margin:24px 0 10px;font-weight:600}
  .md-content h4{font-size:15px;margin:20px 0 8px;font-weight:600}
  .md-content h5{font-size:14px;margin:16px 0 8px;font-weight:600}
  .md-content h6{font-size:13px;margin:16px 0 8px;font-weight:600;color:var(--text-secondary)}
  .heading-anchor{color:var(--accent);text-decoration:none;margin-right:8px;opacity:.6;font-size:.85em}
  .heading-anchor:hover{opacity:1}
  .md-content p{margin:12px 0;line-height:1.7}
  .md-content strong{font-weight:600}
  .md-content em{font-style:italic}
  .md-content del{text-decoration:line-through;color:var(--text-muted)}
  .md-content hr{border:none;border-top:1px solid var(--border-color);margin:24px 0}
  .md-content a{color:var(--accent);text-decoration:none}
  .md-content a:hover{text-decoration:underline}
  .md-content img{max-width:100%;border-radius:6px;margin:12px 0}
  .md-figure{margin:16px 0;text-align:center}
  .md-figure figcaption{font-size:12px;color:var(--text-muted);margin-top:6px}
  .md-content blockquote{border-left:3px solid var(--accent);padding:8px 16px;margin:16px 0;background:var(--accent-bg);border-radius:0 6px 6px 0}
  .md-content blockquote p{margin:4px 0}
  .md-content ul,.md-content ol{padding-left:24px;margin:12px 0}
  .md-content li{margin:4px 0;line-height:1.6}
  .inline-code{background:var(--code-bg);border:1px solid var(--code-border);border-radius:4px;padding:2px 6px;font-family:"JetBrains Mono","Fira Code","Cascadia Code",Consolas,monospace;font-size:.88em;color:var(--preproc)}
  .code-block{margin:16px 0;border:1px solid var(--code-border);border-radius:8px;overflow:hidden;background:var(--code-bg)}
  .code-header{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:var(--bg-tertiary);border-bottom:1px solid var(--code-border);font-size:12px}
  .code-lang{color:var(--text-muted);font-family:"JetBrains Mono","Fira Code",monospace;font-size:11px;text-transform:uppercase}
  .copy-btn{background:none;border:1px solid var(--border-color);border-radius:4px;padding:2px 8px;color:var(--text-muted);font-size:11px;cursor:pointer;transition:background .1s,color .1s}
  .copy-btn:hover{background:var(--bg-hover);color:var(--text-primary)}
  .code-body{margin:0;padding:0;overflow-x:auto;font-family:"JetBrains Mono","Fira Code","Cascadia Code",Consolas,monospace;font-size:13px;line-height:1.5;tab-size:4}
  .code-line{display:flex;min-height:1.5em}
  .line-number{display:inline-block;width:48px;text-align:right;padding-right:12px;color:var(--text-muted);user-select:none;opacity:.5;flex-shrink:0;border-right:1px solid var(--code-border);margin-right:12px}
  .code-content{flex:1;padding-right:16px;white-space:pre}
  .code-body .kw{color:var(--kw)}
  .code-body .cmt{color:var(--cmt);font-style:italic}
  .code-body .str{color:var(--str)}
  .code-body .num{color:var(--num)}
  .code-body .preproc{color:var(--preproc)}
  .code-body .reg{color:var(--reg)}
  .code-body .var{color:var(--var)}
  .md-table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13px}
  .md-table th,.md-table td{padding:8px 12px;border:1px solid var(--border-color);text-align:left}
  .md-table th{background:var(--bg-secondary);font-weight:600}
  .md-table tr:nth-child(even){background:var(--bg-secondary)}

  /* ==================== 笔记编辑模式（原地编辑） ==================== */
  .main-content.edit-mode{position:relative}
  .main-content.edit-mode::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:var(--accent-bg);opacity:0;animation:editModeFlash .4s ease-out forwards;pointer-events:none;z-index:0}
  @keyframes editModeFlash{0%{opacity:.3}100%{opacity:0}}
  .editor-inline{max-width:800px;margin:0 auto;padding:24px;position:relative;z-index:1}
  .editor-inline .edit-header{display:flex;align-items:center;gap:8px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--glass-border);flex-wrap:wrap}
  .editor-inline .edit-title-input{flex:1;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:8px;padding:10px 14px;color:var(--text-primary);font-size:20px;font-weight:700;outline:none;transition:border-color .2s,box-shadow .2s;min-width:200px}
  .editor-inline .edit-title-input:focus{border-color:var(--accent);box-shadow:var(--glow-accent)}
  .editor-inline .edit-category-select{padding:8px 12px;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:6px;color:var(--text-primary);font-size:13px;outline:none}
  .editor-inline .edit-actions{display:flex;gap:8px}
  .editor-inline .edit-btn{padding:8px 18px;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid var(--border-color);background:var(--bg-tertiary);color:var(--text-primary);transition:all .15s;font-weight:500}
  .editor-inline .edit-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .editor-inline .edit-btn.primary:hover{background:var(--accent-hover)}
  .editor-inline .edit-btn:hover{background:var(--bg-hover);border-color:var(--accent)}
  .editor-inline .edit-textarea{width:100%;min-height:calc(100vh - 220px);padding:16px;background:var(--bg-primary);color:var(--text-primary);border:1px solid var(--border-color);border-radius:8px;resize:vertical;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:14px;line-height:1.7;outline:none;tab-size:4;transition:border-color .2s,box-shadow .2s}
  .editor-inline .edit-textarea:focus{border-color:var(--accent);box-shadow:var(--glow-accent)}
  .editor-inline .edit-textarea::placeholder{color:var(--text-muted)}
  /* 编辑器模式标签 */
  .mode-badge{display:none;align-items:center;gap:4px;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-bg);letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
  .mode-badge.visible{display:inline-flex}
  @media(max-width:768px){
    .editor-inline .edit-header{flex-direction:column;align-items:stretch}
    .editor-inline .edit-title-input{min-width:unset}
    .editor-inline .edit-textarea{min-height:calc(100vh - 280px)}
  }
  @media(max-width:480px){
    .editor-inline{padding:16px}
  }

  /* ==================== 编辑器弹窗（保留但降级为备用） ==================== */
  .editor-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(22,22,42,0.92);z-index:300;display:none;justify-content:center;overflow-y:auto;padding:48px 24px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  .editor-overlay.active{display:flex}
  .editor-wrapper{width:100%;max-width:800px;display:flex;flex-direction:column;background:var(--bg-primary);border:1px solid var(--glass-border);border-radius:12px;box-shadow:var(--glass-shadow);overflow:hidden}
  .editor-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--glass-bg);border-bottom:1px solid var(--glass-border);min-height:48px;flex-wrap:wrap;gap:6px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .editor-title-input{flex:1;background:none;border:none;color:var(--text-primary);font-size:15px;font-weight:600;outline:none;min-width:120px}
  .editor-actions{display:flex;gap:6px}
  .editor-btn{padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid var(--border-color);background:var(--bg-tertiary);color:var(--text-primary);transition:background .1s}
  .editor-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .editor-btn.primary:hover{background:var(--accent-hover)}
  .editor-btn:hover{background:var(--bg-hover)}
  .editor-category-select{padding:4px 8px;background:var(--bg-tertiary);border:1px solid var(--border-color);border-radius:4px;color:var(--text-primary);font-size:13px;outline:none}

  /* ==================== 桌宠 — 像素小螃蟹 ==================== */
  .pet{position:fixed;bottom:60px;left:50px;z-index:500;width:106px;height:91px;cursor:grab;user-select:none;-webkit-user-select:none;-moz-user-select:none}
  .pet:active{cursor:grabbing}
  .pet-svg{width:106px;height:91px;overflow:visible;image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges}
  .pet-speech{position:absolute;bottom:95px;left:50%;transform:translateX(-50%);background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--text-secondary);white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,0.15);z-index:1}
  .pet-speech.show{opacity:1}
  .pet-speech::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid var(--border-color)}
  .pet-idle{animation:pet-walk 6s ease-in-out infinite}
  @keyframes pet-walk{0%,100%{transform:translate(0,0)}25%{transform:translate(14px,-2px)}50%{transform:translate(0,-5px)}75%{transform:translate(-14px,-2px)}}
  .claw-left{animation:claw-wave-l 2s ease-in-out infinite}
  @keyframes claw-wave-l{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-8deg)}}
  .claw-right{animation:claw-wave-r 2s ease-in-out infinite}
  @keyframes claw-wave-r{0%,100%{transform:rotate(0deg)}50%{transform:rotate(8deg)}}
  .bubble{animation:bubble-float 3s ease-in-out infinite}

  .pet-sleeping{filter:brightness(0.7) saturate(0.5)}

  /* ==================== 密码门卫 — 银河深空（优化版） ==================== */
  .password-gate{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;transition:opacity .6s,visibility .6s;background:#f5f2fb}
  .password-gate::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 40%,rgba(129,140,248,0.06) 0%,transparent 70%);pointer-events:none}
  .password-gate::after{display:none}

  .password-gate-divider{width:40px;height:2px;background:rgba(30,30,54,0.08);border-radius:1px;margin:0 0 20px 0}

  .password-gate input{width:240px;padding:12px 16px;border-radius:10px;border:1.5px solid rgba(30,30,54,0.1);background:rgba(255,255,255,0.6);color:#1e1e36;font-size:15px;outline:none;transition:all .3s;letter-spacing:1px;font-weight:500}

  .password-gate button{padding:12px 28px;border-radius:10px;border:none;background:rgba(99,102,241,0.85);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .3s;white-space:nowrap;box-shadow:0 2px 12px rgba(99,102,241,0.15);letter-spacing:0.5px}

  // 🔒 密码门卫 —— 修改此处密码即可（当前已关闭，保留代码以便重新启用）
  var GATE_PASSWORD = '2026';
  var GATE_ENABLED = true; // 设为 true 重新启用密码登录

  (function() {
    var gate = document.getElementById('password-gate');
    var input = document.getElementById('password-input');
    var btn = document.getElementById('password-btn');
    var err = document.getElementById('password-error');
    var attempts = 0;

    function tryUnlock() {
      if (input.value === GATE_PASSWORD) {
        gate.classList.add('hidden');
        err.textContent = '';
        // 密码正确，加载 app.js
        var script = document.createElement('script');
        script.src = 'js/app.js';
        document.body.appendChild(script);
      } else {
        attempts++;
        err.textContent = '密码错误' + (attempts >= 3 ? '，再想想？' : '');
        input.value = '';
        input.focus();
        input.style.borderColor = '#ff6b6b';
        setTimeout(function() { input.style.borderColor = ''; }, 600);
      }
    }

    btn.addEventListener('click', tryUnlock);
    input.addEventListener('keydown', function(e) { if (e.key === 'Enter') tryUnlock(); });

    // 密码门已关闭：自动加载 app.js
    if (!GATE_ENABLED) {
      var script = document.createElement('script');
      script.src = 'js/app.js';
      document.body.appendChild(script);
    } else {
      input.focus();
    }
  })();
  </script>
</body>
</html>
